<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B&S Beginner Guide Launcher</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

    :root {
      --bg-black: #000000;
      --text-white: #ffffff;
      --text-muted: #a0a0a0;
      --accent-green: #3fff00;
      --border-color: rgba(255, 255, 255, 0.1);
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; outline: none; }
    html, body { margin: 0; padding: 0; height: 100%; background-color: var(--bg-black); color: var(--text-white); font-family: 'Pretendard', sans-serif; overflow: hidden; }

    /* 상단 헤더 (image_0d4415.png 디자인 반영) */
    .header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      padding: 25px 60px;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }
    .header .logo { font-size: 20px; font-weight: 800; }
    .header-nav { display: flex; gap: 30px; }
    .header-nav button { 
      all: unset; cursor: pointer; color: var(--text-white); 
      font-size: 14px; font-weight: 600; transition: var(--transition); 
    }
    .header-nav button:hover, .header-nav button.active { color: var(--accent-green); }
    .header-auth { 
      padding: 10px 25px; border-radius: 999px; background: var(--text-white); 
      color: var(--bg-black); font-size: 13px; font-weight: 700; border: none; cursor: pointer;
    }

    /* 메인 레이아웃: 좌우 분할 */
    .main-container { display: flex; width: 100%; height: 100vh; }

    /* 왼쪽: 텍스트 패널 (고정) */
    .left-panel {
      flex: 3 1 0;
      width: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 60px 0 100px;
      z-index: 10;
    }
    .category-label { color: var(--accent-green); font-size: 15px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; }
    .main-title { font-size: 52px; font-weight: 900; line-height: 1.15; margin: 0; letter-spacing: -2px; }
    .main-desc { color: var(--text-muted); font-size: 17px; margin: 30px 0 50px; line-height: 1.7; max-width: 480px; }
    
    .action-btn {
      display: inline-flex; align-items: center; gap: 12px;
      color: var(--text-white); font-weight: 700; text-decoration: none; font-size: 16px;
      cursor: pointer; transition: var(--transition);
    }
    .action-btn .circle {
      width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.4); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); font-size: 18px;
    }
    .action-btn:hover .circle { border-color: var(--accent-green); color: var(--accent-green); transform: translateX(8px); }

    /* 오른쪽: 상세 출력 영역 (스크롤 가능) */
    .right-panel {
      flex: 7 1 0;
      width: 70%;
      height: 100%;
      position: relative;
      background: #080808;
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 120px 60px 80px;
    }

    /* 콘텐츠 애니메이션 */
    #displayArea { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 이미지 스타일 */
    .content-img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }

    /* 초반 파밍 순서도 */
    .farm-button-wrap {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0 0 14px;
      background: linear-gradient(to bottom, #080808 72%, rgba(8,8,8,0));
    }
    .farm-top-btn {
      all: unset;
      cursor: pointer;
      text-align: center;
      padding: 13px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #111;
      color: #d0d0d0;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      transition: var(--transition);
    }
    .farm-top-btn:hover, .farm-top-btn.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(63,255,0,0.08);
    }
    .farm-detail {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: #0f0f0f;
      padding: 18px;
    }
    .farm-detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .farm-detail h3 { margin: 0; font-size: 24px; }
    .farm-badge { color: var(--accent-green); font-weight: 900; font-size: 13px; white-space: nowrap; }
    .farm-detail p { margin: 0 0 16px; color: var(--text-muted); line-height: 1.6; font-size: 14px; }
    .farm-detail img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 24px 48px rgba(0,0,0,0.45); }

    /* 아이템 드랍 검색 UI */
    .search-box { width: 100%; background: #151515; border: 1px solid var(--border-color); color: #fff; padding: 18px; border-radius: 10px; margin-bottom: 25px; font-size: 16px; }
    .dungeon-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 30px; }
    .tab-item { padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 13px; text-align: center; }
    .tab-item.active { border-color: var(--accent-green); color: var(--accent-green); font-weight: 700; }
    
    .drop-table { width: 100%; border-collapse: collapse; background: #0a0a0a; border-radius: 12px; overflow: hidden; }
    .drop-table th { background: #1a1a1a; color: var(--accent-green); padding: 15px; font-size: 14px; border-bottom: 1px solid var(--border-color); }
    .drop-table td { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; color: #ccc; font-size: 14px; }

    /* 하단 팁 */
    .bottom-footer { position: fixed; bottom: 40px; left: 100px; color: var(--text-muted); font-size: 13px; font-weight: 500; }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .main-container { flex-direction: column; height: auto; min-height: 100vh; }
      .left-panel, .right-panel { width: 100%; flex: none; }
      .left-panel { min-height: 360px; padding: 120px 28px 50px; }
      .right-panel { padding: 40px 24px 80px; overflow: visible; }
      .header { padding: 20px 24px; gap: 16px; flex-wrap: wrap; }
      .header-nav { gap: 14px; flex-wrap: wrap; }
      .bottom-footer { left: 28px; bottom: 20px; }
      .farm-button-wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); position: static; background: transparent; }
    }

    /* 스크롤바 커스텀 */
    .right-panel::-webkit-scrollbar { width: 4px; }
    .right-panel::-webkit-scrollbar-thumb { background: var(--accent-green); border-radius: 10px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="logo">B&S 회상서버</div>
    <nav class="header-nav" id="mainNav">
      <button class="active" data-id="home">캐릭생성 & 기초세팅</button>
      <button data-id="start">초반 파밍 순서</button>
      <button data-id="control">아이템 드랍 정보</button>
      <button data-id="class">문파 정보</button>
      <button data-id="faq">게임 설정</button>
      <button data-id="extra">FAQ</button>
    </nav>
    <button class="header-auth">COMMUNITY</button>
  </header>

  <div class="main-container">
    <div class="left-panel">
      <div class="category-label" id="sideLabel">SETTING</div>
      <h1 class="main-title" id="sideTitle">캐릭터 생성 및<br>기초 세팅</h1>
      <p class="main-desc" id="sideDesc">회상서버를 시작하는 첫걸음! 최적화된 게임 환경과 초기 동선을 확인하세요.</p>
      <div class="action-btn">
        <span>상세 가이드 보기</span>
        <div class="circle">→</div>
      </div>
    </div>

    <div class="right-panel">
      <div id="displayArea">
        <!-- 초기 이미지 출력 (압축파일 내 경로) -->
        <img src="images/home.jpeg" class="content-img" onerror="this.src='https://via.placeholder.com/800x1200/111/3fff00?text=HOME+IMAGE'">
      </div>
    </div>
  </div>

  <div class="bottom-footer" id="rotatingTip">TIP: 캐릭터 생성 시 문파 가입 여부를 먼저 확인하세요.</div>

  <script>
    const navBtns = document.querySelectorAll('#mainNav button');
    const displayArea = document.getElementById('displayArea');

    let excelLoaded = false;
    let excelLoading = false;
    let selectedDungeonId = null;
    let selectedFarmIndex = 0;
    let dropRows = [];
    let dungeonRows = [];
    const dungeonMap = new Map();

    const config = {
      home: { label: 'SETTING', title: '캐릭터 생성 및<br>기초 세팅', desc: '최적의 UI 세팅과 초기 필수 퀘스트 동선을 정리했습니다.', type: 'image', path: 'images/home.jpeg' },
      start: { label: 'FARMING', title: '초반 파밍<br>장비 가이드', desc: '무기, 보패, 액세서리 순서대로 맞추는 효율적인 성장 루트입니다.', type: 'farm' },
      control: { label: 'DATABASE', title: '던전별 아이템<br>드랍 리스트', desc: '던전명이나 아이템명을 검색하여 드랍 정보를 확인하세요.', type: 'drop' },
      class: { label: 'CLAN', title: '서버 주요 문파<br>가입 안내', desc: '함께할 동료를 찾으시나요? 대표 문파 정보를 확인하세요.', type: 'image', path: 'images/class.jpeg' },
      faq: { label: 'OPTION', title: '프레임 최적화<br>상세 설정', desc: '쾌적한 플레이를 위한 필수적인 게임 내부 설정 가이드입니다.', type: 'image', path: 'images/faq.jpeg' },
      extra: { label: 'FAQ', title: '초보자<br>자주 묻는 질문', desc: '홍보 보상, 신석 사용처 등 필수 지식을 모았습니다.', type: 'image', path: 'images/extra.jpeg' }
    };

    const farmingSteps = [
      { title: '천상분지', image: 'images/farm/01-skyfield.jpeg', desc: '1순서 파밍 구간입니다. 천상분지 이미지와 연결했습니다.' },
      { title: '흑룡의환영', image: 'images/farm/02-blackdragon.jpeg', desc: '2순서 파밍 구간입니다. 흑룡의환영 이미지와 연결했습니다.' },
      { title: '얼음창고', image: 'images/farm/03-icewarehouse.jpeg', desc: '3순서 파밍 구간입니다. 얼음창고 이미지와 연결했습니다.' },
      { title: '부유재단', image: 'images/farm/04-floatingaltar.jpeg', desc: '4순서 파밍 구간입니다. 부유재단 이미지와 연결했습니다.' },
      { title: '저주받은해적선', image: 'images/farm/05-pirateship.jpeg', desc: '5순서 파밍 구간입니다. 저주받은해적선 이미지와 연결했습니다.' },
      { title: '천명부화장', image: 'images/farm/06-destinygrave.jpeg', desc: '6순서 파밍 구간입니다. 천명부화장 이미지와 연결했습니다.' },
      { title: '귀면극단', image: 'images/farm/07-masktheater.jpeg', desc: '7순서 파밍 구간입니다. 귀면극단 이미지와 연결했습니다.' }
    ];

    function renderFarmingGuide() {
      const currentStep = farmingSteps[selectedFarmIndex] || farmingSteps[0];
      const buttons = farmingSteps.map((step, index) =>
        '<button class="farm-top-btn ' + (index === selectedFarmIndex ? 'active' : '') + '" data-index="' + index + '">' + step.title + '</button>'
      ).join('');

      displayArea.innerHTML =
        '<div class="farm-button-wrap" id="farmButtonWrap">' + buttons + '</div>' +
        '<article class="farm-detail">' +
          '<div class="farm-detail-head">' +
            '<h3>' + currentStep.title + '</h3>' +
            '<span class="farm-badge">' + String(selectedFarmIndex + 1).padStart(2, '0') + ' / ' + String(farmingSteps.length).padStart(2, '0') + '</span>' +
          '</div>' +
          '<p>' + currentStep.desc + '</p>' +
          '<img src="' + currentStep.image + '" alt="' + currentStep.title + '" onerror="this.style.display=\'none\'">' +
        '</article>';

      document.querySelectorAll('#farmButtonWrap .farm-top-btn').forEach(button => {
        button.addEventListener('click', () => {
          selectedFarmIndex = Number(button.dataset.index);
          renderFarmingGuide();
        });
      });
    }

    function switchView(id) {
      const data = config[id];
      navBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.id === id));
      
      document.getElementById('sideLabel').textContent = data.label;
      document.getElementById('sideTitle').innerHTML = data.title;
      document.getElementById('sideDesc').textContent = data.desc;

      displayArea.innerHTML = '';
      if (data.type === 'image') {
        displayArea.innerHTML = `<img src="${data.path}" class="content-img" onerror="this.src='https://via.placeholder.com/800x1000/111/3fff00?text=IMAGE+NOT+FOUND'">`;
      } else if (data.type === 'farm') {
        renderFarmingGuide();
      } else if (data.type === 'drop') {
        renderDropSearch();
      }
    }

    function cellText(value) {
      return value === undefined || value === null ? '' : String(value).trim();
    }

    function sheetToObjects(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (!rows.length) return [];
      const headers = rows[0].map(cellText);
      return rows.slice(1)
        .filter(row => row.some(value => cellText(value) !== ''))
        .map(row => {
          const obj = {};
          headers.forEach((header, index) => {
            if (header) obj[header] = cellText(row[index]);
          });
          return obj;
        });
    }

    async function loadExcelData() {
      if (excelLoaded || excelLoading) return;
      excelLoading = true;
      try {
        if (typeof XLSX === 'undefined') {
          throw new Error('XLSX 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 CDN 차단 여부를 확인하세요.');
        }

        const response = await fetch('data/info_search_data.xlsx', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`엑셀 파일을 찾을 수 없습니다. 경로: data/info_search_data.xlsx (${response.status})`);
        }

        const buffer = await response.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const dungeonSheet = workbook.Sheets['던전목록'];
        const dropSheet = workbook.Sheets['드랍목록'];

        if (!dungeonSheet || !dropSheet) {
          throw new Error('필수 시트명(던전목록, 드랍목록)을 찾을 수 없습니다.');
        }

        dungeonRows = sheetToObjects(dungeonSheet);
        dropRows = sheetToObjects(dropSheet);
        dungeonMap.clear();
        dungeonRows.forEach(row => {
          const id = cellText(row['던전ID']);
          if (id) dungeonMap.set(id.toUpperCase(), cellText(row['던전명']));
        });

        dropRows = dropRows.map(row => {
          const dungeonId = cellText(row['던전ID']);
          return {
            dungeonId,
            dungeonKey: dungeonId.toUpperCase(),
            dungeonName: dungeonMap.get(dungeonId.toUpperCase()) || dungeonId,
            grade: cellText(row['등급']),
            item: cellText(row['아이템'])
          };
        }).filter(row => row.dungeonId && row.item);

        selectedDungeonId = dropRows[0]?.dungeonKey || dungeonRows[0]?.['던전ID']?.toUpperCase() || null;
        excelLoaded = true;
      } catch (error) {
        displayArea.innerHTML = `
          <div style="padding:22px;border:1px solid rgba(255,255,255,0.18);border-radius:12px;background:#111;line-height:1.7;color:#ddd;">
            <strong style="color:#ff6b6b;">엑셀 데이터를 불러오지 못했습니다.</strong><br>
            ${error.message}<br><br>
            <span style="color:#aaa;">로컬에서 index.html을 직접 열면 브라우저 보안 정책 때문에 fetch가 막힐 수 있습니다. GitHub Pages 같은 웹서버에 올리거나 로컬 서버로 실행하세요.</span>
          </div>
        `;
      } finally {
        excelLoading = false;
      }
    }

    function getVisibleDungeons() {
      const ids = new Set(dropRows.map(row => row.dungeonKey));
      const fromDungeonSheet = dungeonRows
        .map(row => ({ id: cellText(row['던전ID']).toUpperCase(), name: cellText(row['던전명']) }))
        .filter(row => row.id && ids.has(row.id));

      const missing = [...ids]
        .filter(id => !fromDungeonSheet.some(row => row.id === id))
        .map(id => ({ id, name: dungeonMap.get(id) || id }));

      return [...fromDungeonSheet, ...missing];
    }

    function renderDropTable() {
      const keyword = document.getElementById('dropSearchInput')?.value.trim().toLowerCase() || '';
      const rows = dropRows.filter(row => {
        const matchDungeon = !selectedDungeonId || row.dungeonKey === selectedDungeonId;
        const haystack = `${row.dungeonName} ${row.grade} ${row.item}`.toLowerCase();
        return matchDungeon && (!keyword || haystack.includes(keyword));
      });

      const tbody = document.getElementById('dropTableBody');
      const counter = document.getElementById('dropCounter');
      if (!tbody) return;

      counter.textContent = `${rows.length.toLocaleString()}개 항목`;
      tbody.innerHTML = rows.length ? rows.map(row => `
        <tr>
          <td>${row.dungeonName}</td>
          <td>${row.grade}</td>
          <td>${row.item}</td>
        </tr>
      `).join('') : `
        <tr><td colspan="3" style="color:#888;">검색 결과가 없습니다.</td></tr>
      `;
    }

    async function renderDropSearch() {
      displayArea.innerHTML = `
        <div style="padding:22px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:#111;color:#aaa;">엑셀 데이터를 불러오는 중입니다...</div>
      `;

      await loadExcelData();
      if (!excelLoaded) return;

      const dungeons = getVisibleDungeons();
      if (!selectedDungeonId && dungeons.length) selectedDungeonId = dungeons[0].id;

      displayArea.innerHTML = `
        <input type="text" id="dropSearchInput" class="search-box" placeholder="🔍 아이템명 / 던전명 / 등급 검색...">
        <div class="dungeon-tabs" id="dungeonTabs">
          ${dungeons.map((dungeon, index) => `
            <div class="tab-item ${dungeon.id === selectedDungeonId || (!selectedDungeonId && index === 0) ? 'active' : ''}" data-id="${dungeon.id}">${dungeon.name}</div>
          `).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#aaa;font-size:13px;">
          <span>출처: data/info_search_data.xlsx</span>
          <span id="dropCounter"></span>
        </div>
        <table class="drop-table">
          <thead><tr><th>던전</th><th>등급</th><th>아이템 명칭</th></tr></thead>
          <tbody id="dropTableBody"></tbody>
        </table>
      `;

      document.getElementById('dropSearchInput').addEventListener('input', renderDropTable);
      document.querySelectorAll('#dungeonTabs .tab-item').forEach(tab => {
        tab.addEventListener('click', () => {
          selectedDungeonId = tab.dataset.id;
          document.querySelectorAll('#dungeonTabs .tab-item').forEach(item => item.classList.toggle('active', item === tab));
          renderDropTable();
        });
      });
      renderDropTable();
    }

    navBtns.forEach(btn => btn.onclick = () => switchView(btn.dataset.id));

    // 팁 로테이션
    const tips = ["TIP: 홍보 보상은 매일 자정에 초기화됩니다.", "TIP: 문파 가입 시 추가 능력치 버프가 있습니다."];
    let tIdx = 0;
    setInterval(() => {
      tIdx = (tIdx + 1) % tips.length;
      document.getElementById('rotatingTip').textContent = tips[tIdx];
    }, 5000);
  </script>
</body>
</html>
