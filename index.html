<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B&S Beginner Guide Launcher</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

    :root {
      --bg-black: #000000;
      --text-white: #ffffff;
      --text-muted: #a0a0a0;
      --accent-green: #3fff00;
      --border-color: rgba(255, 255, 255, 0.1);
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --page-max: 1680px;
      --page-gutter: 24px;
      --page-width: min(var(--page-max), calc(100vw - (var(--page-gutter) * 2)));
    }

    * { box-sizing: border-box; outline: none; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050505;
      color: var(--text-white);
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
    }

    /* 상단 헤더 (image_0d4415.png 디자인 반영) */
    .header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--page-width);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 22px 34px;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.92), transparent);
    }
    .header .logo {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: clamp(17px, 1.6vw, 22px);
      font-weight: 800;
      white-space: nowrap;
    }
    .header .logo-credit {
      color: rgba(255,255,255,0.7);
      font-size: clamp(10px, 0.85vw, 12px);
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .header-nav {
      flex: 1 1 auto;
      display: flex;
      justify-content: flex-end;
      gap: clamp(12px, 2vw, 28px);
      min-width: 0;
    }
    .header-nav button { 
      all: unset; cursor: pointer; color: var(--text-white); 
      font-size: clamp(13px, 1.25vw, 16px); font-weight: 700; line-height: 1.25; padding: 8px 1px;
      white-space: nowrap;
      transition: var(--transition); 
    }
    .header-nav button:hover,
    .header-nav button.active,
    .nav-dropdown.active > .dropdown-toggle { color: var(--accent-green); }
    .nav-dropdown {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: -10px;
    }
    .dropdown-toggle::after {
      content: '▾';
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      transform: translateY(-1px);
      transition: var(--transition);
    }
    .nav-dropdown:hover .dropdown-toggle::after,
    .nav-dropdown:focus-within .dropdown-toggle::after { transform: translateY(-1px) rotate(180deg); }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 172px;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: rgba(8, 8, 8, 0.96);
      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: var(--transition);
    }
    .nav-dropdown:hover .dropdown-menu,
    .nav-dropdown:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .dropdown-menu button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      color: #d8d8d8;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
    }
    .dropdown-menu button:hover,
    .dropdown-menu button.active {
      color: var(--accent-green);
      background: rgba(63,255,0,0.08);
    }

    /* 메인 레이아웃: 좌우 분할 */
    .main-container {
      display: flex;
      width: var(--page-width);
      height: 100vh;
      margin: 0 auto;
      background: var(--bg-black);
      box-shadow: 0 0 80px rgba(0,0,0,0.65);
    }

    /* 왼쪽: 텍스트 패널 (고정) */
    .left-panel {
      flex: 3 1 0;
      width: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 60px 0 100px;
      z-index: 10;
    }
    .category-label { color: var(--accent-green); font-size: 15px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; }
    
    /* 제목 영역을 감싸는 박스와 서버 온오프 표시용 추가 CSS */
    .title-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }
    .main-title { font-size: 52px; font-weight: 900; line-height: 1.15; margin: 0; letter-spacing: -2px; position: relative; }
    
    /* 서버 상태 표시 배지 스타일 */
    .server-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 15px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition: var(--transition);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #888888; /* 기본값 회색 */
      box-shadow: 0 0 8px #888888;
      transition: var(--transition);
    }
    /* 온 상태 (노란색) */
    .server-status-badge.on .status-dot { background-color: #FFD700; box-shadow: 0 0 10px #FFD700; }
    .server-status-badge.on { color: #FFD700; border-color: rgba(255, 215, 0, 0.3); }
    /* 오프 상태 (빨간색) */
    .server-status-badge.off .status-dot { background-color: #FF0000; box-shadow: 0 0 10px #FF0000; }
    .server-status-badge.off { color: #FF0000; border-color: rgba(255, 0, 0, 0.3); }
    
    .main-desc { color: var(--text-muted); font-size: 17px; margin: 30px 0 50px; line-height: 1.7; max-width: 480px; }
    
    .action-btn {
      display: inline-flex; align-items: center; gap: 12px;
      color: var(--text-white); font-weight: 700; text-decoration: none; font-size: 16px;
      cursor: pointer; transition: var(--transition);
    }
    .action-btn .circle {
      width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.4); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); font-size: 18px;
    }
    .action-btn:hover .circle { border-color: var(--accent-green); color: var(--accent-green); transform: translateX(8px); }

    /* 오른쪽: 상세 출력 영역 (스크롤 가능) */
    .right-panel {
      flex: 7 1 0;
      width: 70%;
      height: 100%;
      position: relative;
      background: #080808;
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 120px 60px 80px;
    }

    /* 콘텐츠 애니메이션 */
    #displayArea { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 이미지 스타일 */
    .content-img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }

    /* 초반 파밍 순서도 */
    .farm-button-wrap {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0 0 14px;
      background: linear-gradient(to bottom, #080808 72%, rgba(8,8,8,0));
    }
    .farm-top-btn {
      all: unset;
      cursor: pointer;
      text-align: center;
      padding: 13px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #111;
      color: #d0d0d0;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      transition: var(--transition);
    }
    .farm-top-btn:hover, .farm-top-btn.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(63,255,0,0.08);
    }
    .farm-detail {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: #0f0f0f;
      padding: 18px;
    }
    .farm-detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .farm-detail h3 { margin: 0; font-size: 24px; }
    .farm-badge { color: var(--accent-green); font-weight: 900; font-size: 13px; white-space: nowrap; }
    .farm-detail p { margin: 0 0 16px; color: var(--text-muted); line-height: 1.6; font-size: 14px; }
    .farm-detail img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 24px 48px rgba(0,0,0,0.45); }

    /* 아이템 드랍 검색 UI */
    .search-box { width: 100%; background: #151515; border: 1px solid var(--border-color); color: #fff; padding: 18px; border-radius: 10px; margin-bottom: 25px; font-size: 16px; }
    .dungeon-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 30px; }
    .dungeon-tabs.search-mode { opacity: 0.55; }
    .dungeon-tabs.search-mode .tab-item { cursor: default; }
    .drop-search-status { margin: -12px 0 18px; color: #9a9a9a; font-size: 13px; line-height: 1.5; }
    .drop-search-status strong { color: var(--accent-green); }
    .tab-item { padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 13px; text-align: center; }
    .tab-item.active { border-color: var(--accent-green); color: var(--accent-green); font-weight: 700; }
    
    .drop-table { width: 100%; border-collapse: collapse; background: #0a0a0a; border-radius: 12px; overflow: hidden; }
    .drop-table th { background: #1a1a1a; color: var(--accent-green); padding: 15px; font-size: 14px; border-bottom: 1px solid var(--border-color); }
    .drop-table td { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; color: #ccc; font-size: 14px; }
    .drop-group-wrap { display: flex; flex-direction: column; gap: 18px; }
    .drop-dungeon-card { border: 1px solid var(--border-color); background: #0b0b0b; border-radius: 14px; overflow: hidden; }
    .drop-dungeon-title { padding: 14px 16px; background: #151515; border-bottom: 1px solid var(--border-color); color: #fff; font-weight: 900; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .drop-dungeon-title small { color: var(--accent-green); font-size: 12px; white-space: nowrap; }
    .drop-grade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; }
    .drop-grade-col { min-height: 120px; padding: 14px; border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
    .drop-grade-col:last-child { border-right: 0; }
    .drop-grade-title { color: var(--accent-green); font-weight: 900; font-size: 14px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(63,255,0,0.18); }
    .drop-item-list { display: flex; flex-direction: column; gap: 7px; }
    .drop-item-chip { color: #d8d8d8; background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 9px 10px; font-size: 13px; line-height: 1.35; word-break: keep-all; }
    .drop-empty { color: #666; font-size: 13px; padding: 9px 0; }

    /* 하단 팁 */
    .bottom-footer {
      position: fixed;
      bottom: 40px;
      left: max(var(--page-gutter), calc((100vw - var(--page-max)) / 2 + 40px));
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    @media (max-width: 900px) {
      :root {
        --page-gutter: 0px;
        --page-width: 100vw;
      }
      html, body { overflow: auto; }
      .main-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        width: 100%;
        box-shadow: none;
      }
      .left-panel, .right-panel { width: 100%; flex: none; }
      .left-panel { min-height: 360px; padding: 120px 28px 50px; }
      .right-panel { padding: 40px 24px 80px; overflow: visible; }
      .header {
        left: 0;
        transform: none;
        width: 100%;
        padding: 18px 22px;
        gap: 14px;
        flex-wrap: wrap;
      }
      .header .logo { width: 100%; font-size: 18px; }
      .header .logo-credit { font-size: 11px; }
      .header-nav { width: 100%; justify-content: flex-start; gap: 12px; flex-wrap: wrap; }
      .header-nav button { font-size: 14px; padding: 6px 1px; }
      .nav-dropdown { padding-bottom: 6px; margin-bottom: -6px; }
      .dropdown-menu { min-width: 152px; top: calc(100% + 4px); }
      .dropdown-menu button { font-size: 13px; padding: 9px 10px; }
      .bottom-footer { left: 28px; bottom: 20px; }
      .farm-button-wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); position: static; background: transparent; }
      .drop-grade-grid { grid-template-columns: 1fr; }
      .drop-grade-col { border-right: 0; border-bottom: 1px solid var(--border-color); }
      .drop-grade-col:last-child { border-bottom: 0; }
    }

    /* 스크롤바 커스텀 */
    .right-panel::-webkit-scrollbar { width: 4px; }
    .right-panel::-webkit-scrollbar-thumb { background: var(--accent-green); border-radius: 10px; }


    @media (min-width: 901px) and (max-width: 1180px) {
      .header { padding: 20px 28px; gap: 18px; }
      .header-nav { gap: 14px; }
      .header-nav button { font-size: 13px; }
      .left-panel { padding: 0 44px 0 72px; }
      .main-title { font-size: 46px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="logo">B&S 회상서버 <span class="logo-credit">[제작 : 혼천교 샵문파]</span></div>
    <nav class="header-nav" id="mainNav">
      <div class="nav-dropdown active" id="basicDropdown">
        <button type="button" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">캐릭터 생성 및 기초세팅</button>
        <div class="dropdown-menu" role="menu">
          <button class="active" data-id="charCreate" role="menuitem">캐릭터생성</button>
          <button data-id="divineStone" role="menuitem">신석사용처</button>
          <button data-id="badgeGuide" role="menuitem">신공패/비공패</button>
          <button data-id="justiceGroup" role="menuitem">의협단</button>
          <button data-id="stonePlate" role="menuitem">석판</button>
        </div>
      </div>
      <button data-id="start">초반 파밍 순서</button>
      <button data-id="control">아이템 드랍 정보</button>
      <button data-id="class">문파 정보</button>
      <button data-id="faq">게임 설정</button>
      <button data-id="extra">FAQ</button>
    </nav>
  </header>

  <div class="main-container">
    <div class="left-panel">
      <div class="category-label" id="sideLabel">SETTING</div>
      <div class="title-wrapper">
        <h1 class="main-title" id="sideTitle">캐릭터 생성 및<br>기초 세팅</h1>
        <div class="server-status-badge" id="serverStatusBadge">
          <span class="status-dot"></span>
          <span id="serverStatusText">SERVER CHECKING...</span>
        </div>
      </div>
      <p class="main-desc" id="sideDesc">회상서버를 시작하는 첫걸음! (출처 : 블루님)</p>
      <div class="action-btn">
        <span>상세 가이드 보기</span>
        <div class="circle">→</div>
      </div>
    </div>

    <div class="right-panel">
      <div id="displayArea">
        <img src="images/home.jpeg" class="content-img" onerror="this.src='https://via.placeholder.com/800x1200/111/3fff00?text=HOME+IMAGE'">
      </div>
    </div>
  </div>

  <div class="bottom-footer" id="rotatingTip">TIP: 캐릭터 생성 후 문파 가입하시는걸 추천!!.</div>

  <script>
    // [추가 기능] 프리서버 실시간 ON/OFF 체크 스크립트
    const SERVER_IP = "183.100.139.82";
    
    function updateServerStatus() {
      const badge = document.getElementById('serverStatusBadge');
      const text = document.getElementById('serverStatusText');
      
      // 공개 포트/핑 체크 프록시 API 활용 (CORS 우회 및 브라우저 환경 지원)
      fetch(`https://api.ping.gg/ping/${SERVER_IP}`)
        .then(response => response.json())
        .then(data => {
          // 응답 성공 여부 파악 (온/오프 판별)
          if (data && data.success) {
            badge.className = "server-status-badge on";
            text.textContent = "SERVER ON";
          } else {
            badge.className = "server-status-badge off";
            text.textContent =
