<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B&S Beginner Guide Launcher</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

    :root {
      --bg-black: #000000;
      --text-white: #ffffff;
      --text-muted: #a0a0a0;
      --accent-green: #3fff00;
      --border-color: rgba(255, 255, 255, 0.1);
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --page-max: 1680px;
      --page-gutter: 24px;
      --page-width: min(var(--page-max), calc(100vw - (var(--page-gutter) * 2)));
    }

    * { box-sizing: border-box; outline: none; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050505;
      color: var(--text-white);
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
    }

    /* 상단 헤더 (image_0d4415.png 디자인 반영) */
    .header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--page-width);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 22px 34px;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.92), transparent);
    }
    .header .logo {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: clamp(17px, 1.6vw, 22px);
      font-weight: 800;
      white-space: nowrap;
    }
    .header .logo-credit {
      color: rgba(255,255,255,0.7);
      font-size: clamp(10px, 0.85vw, 12px);
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .header-nav {
      flex: 1 1 auto;
      display: flex;
      justify-content: flex-end;
      gap: clamp(12px, 2vw, 28px);
      min-width: 0;
    }
    .header-nav button { 
      all: unset; cursor: pointer; color: var(--text-white); 
      font-size: clamp(13px, 1.25vw, 16px); font-weight: 700; line-height: 1.25; padding: 8px 1px;
      white-space: nowrap;
      transition: var(--transition); 
    }
    .header-nav button:hover, .header-nav button.active { color: var(--accent-green); }

    /* 메인 레이아웃: 좌우 분할 */
    .main-container {
      display: flex;
      width: var(--page-width);
      height: 100vh;
      margin: 0 auto;
      background: var(--bg-black);
      box-shadow: 0 0 80px rgba(0,0,0,0.65);
    }

    /* 왼쪽: 텍스트 패널 (고정) */
    .left-panel {
      flex: 3 1 0;
      width: 30%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 60px 0 100px;
      z-index: 10;
    }
    .category-label { color: var(--accent-green); font-size: 15px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; }
    .main-title { font-size: 52px; font-weight: 900; line-height: 1.15; margin: 0; letter-spacing: -2px; }
    .main-desc { color: var(--text-muted); font-size: 17px; margin: 30px 0 50px; line-height: 1.7; max-width: 480px; }
    
    .action-btn {
      display: inline-flex; align-items: center; gap: 12px;
      color: var(--text-white); font-weight: 700; text-decoration: none; font-size: 16px;
      cursor: pointer; transition: var(--transition);
    }
    .action-btn .circle {
      width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.4); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); font-size: 18px;
    }
    .action-btn:hover .circle { border-color: var(--accent-green); color: var(--accent-green); transform: translateX(8px); }

    /* 오른쪽: 상세 출력 영역 (스크롤 가능) */
    .right-panel {
      flex: 7 1 0;
      width: 70%;
      height: 100%;
      position: relative;
      background: #080808;
      border-left: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 120px 60px 80px;
    }

    /* 콘텐츠 애니메이션 */
    #displayArea { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 이미지 스타일 */
    .content-img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }

    /* 초반 파밍 순서도 */
    .farm-button-wrap {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 22px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0 0 14px;
      background: linear-gradient(to bottom, #080808 72%, rgba(8,8,8,0));
    }
    .farm-top-btn {
      all: unset;
      cursor: pointer;
      text-align: center;
      padding: 13px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #111;
      color: #d0d0d0;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      transition: var(--transition);
    }
    .farm-top-btn:hover, .farm-top-btn.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(63,255,0,0.08);
    }
    .farm-detail {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: #0f0f0f;
      padding: 18px;
    }
    .farm-detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .farm-detail h3 { margin: 0; font-size: 24px; }
    .farm-badge { color: var(--accent-green); font-weight: 900; font-size: 13px; white-space: nowrap; }
    .farm-detail p { margin: 0 0 16px; color: var(--text-muted); line-height: 1.6; font-size: 14px; }
    .farm-detail img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 24px 48px rgba(0,0,0,0.45); }

    /* 아이템 드랍 검색 UI */
    .search-box { width: 100%; background: #151515; border: 1px solid var(--border-color); color: #fff; padding: 18px; border-radius: 10px; margin-bottom: 25px; font-size: 16px; }
    .dungeon-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 30px; }
    .dungeon-tabs.search-mode { opacity: 0.55; }
    .dungeon-tabs.search-mode .tab-item { cursor: default; }
    .drop-search-status { margin: -12px 0 18px; color: #9a9a9a; font-size: 13px; line-height: 1.5; }
    .drop-search-status strong { color: var(--accent-green); }
    .tab-item { padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 13px; text-align: center; }
    .tab-item.active { border-color: var(--accent-green); color: var(--accent-green); font-weight: 700; }
    
    .drop-table { width: 100%; border-collapse: collapse; background: #0a0a0a; border-radius: 12px; overflow: hidden; }
    .drop-table th { background: #1a1a1a; color: var(--accent-green); padding: 15px; font-size: 14px; border-bottom: 1px solid var(--border-color); }
    .drop-table td { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; color: #ccc; font-size: 14px; }
    .drop-group-wrap { display: flex; flex-direction: column; gap: 18px; }
    .drop-dungeon-card { border: 1px solid var(--border-color); background: #0b0b0b; border-radius: 14px; overflow: hidden; }
    .drop-dungeon-title { padding: 14px 16px; background: #151515; border-bottom: 1px solid var(--border-color); color: #fff; font-weight: 900; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .drop-dungeon-title small { color: var(--accent-green); font-size: 12px; white-space: nowrap; }
    .drop-grade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; }
    .drop-grade-col { min-height: 120px; padding: 14px; border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
    .drop-grade-col:last-child { border-right: 0; }
    .drop-grade-title { color: var(--accent-green); font-weight: 900; font-size: 14px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(63,255,0,0.18); }
    .drop-item-list { display: flex; flex-direction: column; gap: 7px; }
    .drop-item-chip { color: #d8d8d8; background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 9px 10px; font-size: 13px; line-height: 1.35; word-break: keep-all; }
    .drop-empty { color: #666; font-size: 13px; padding: 9px 0; }

    /* 하단 팁 */
    .bottom-footer {
      position: fixed;
      bottom: 40px;
      left: max(var(--page-gutter), calc((100vw - var(--page-max)) / 2 + 40px));
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    @media (max-width: 900px) {
      :root {
        --page-gutter: 0px;
        --page-width: 100vw;
      }
      html, body { overflow: auto; }
      .main-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        width: 100%;
        box-shadow: none;
      }
      .left-panel, .right-panel { width: 100%; flex: none; }
      .left-panel { min-height: 360px; padding: 120px 28px 50px; }
      .right-panel { padding: 40px 24px 80px; overflow: visible; }
      .header {
        left: 0;
        transform: none;
        width: 100%;
        padding: 18px 22px;
        gap: 14px;
        flex-wrap: wrap;
      }
      .header .logo { width: 100%; font-size: 18px; }
      .header .logo-credit { font-size: 11px; }
      .header-nav { width: 100%; justify-content: flex-start; gap: 12px; flex-wrap: wrap; }
      .header-nav button { font-size: 14px; padding: 6px 1px; }
      .bottom-footer { left: 28px; bottom: 20px; }
      .farm-button-wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); position: static; background: transparent; }
      .drop-grade-grid { grid-template-columns: 1fr; }
      .drop-grade-col { border-right: 0; border-bottom: 1px solid var(--border-color); }
      .drop-grade-col:last-child { border-bottom: 0; }
    }

    /* 스크롤바 커스텀 */
    .right-panel::-webkit-scrollbar { width: 4px; }
    .right-panel::-webkit-scrollbar-thumb { background: var(--accent-green); border-radius: 10px; }


    @media (min-width: 901px) and (max-width: 1180px) {
      .header { padding: 20px 28px; gap: 18px; }
      .header-nav { gap: 14px; }
      .header-nav button { font-size: 13px; }
      .left-panel { padding: 0 44px 0 72px; }
      .main-title { font-size: 46px; }
    }
  </style>

</head>

            "아이템": "장풍허리띠 : 흑룡교 비밀전당"
      },
      {
            "던전ID": "Upa",
            "등급": "9단",
            "아이템": "열풍 반지 : 흑룡교 비밀전당"
      }
];

    const config = {
      home: { label: 'SETTING', title: '캐릭터 생성 및<br>기초 세팅', desc: '최적의 세팅과 초기 동선을 정리했습니다.', type: 'image', path: 'images/home.jpeg' },
      start: { label: 'FARMING', title: '초반 파밍<br>장비 가이드', desc: '장비를 업글하는 효율적인 성장 루트입니다.', type: 'farm' },
      control: { label: 'DATABASE', title: '던전별 아이템<br>드랍 리스트', desc: '던전명이나 아이템명을 검색하여 드랍 정보를 확인하세요.', type: 'drop' },
      class: { label: 'CLAN', title: '각 세력별<br>문파 소개', desc: '함께할 동료를 찾으시나요? 대표 문파 정보를 확인하세요.', type: 'image', path: 'images/class.jpeg' },
      faq: { label: 'OPTION', title: '게임UI설정 및<br>저장 방법', desc: '쾌적한 플레이를 위한 필수적인 게임 내부 설정 가이드입니다.', type: 'image', path: 'images/faq.jpeg' },
      extra: { label: 'FAQ', title: '초보자<br>자주 묻는 질문', desc: '서버내 자주묻는 질문들을 모아봤습니다!.', type: 'image', path: 'images/extra.jpeg' }
    };

    const farmingSteps = [
      { title: '천상분지', image: 'images/farm/01-skyfield.jpeg', desc: '천상분지.' },
      { title: '흑룡의환영', image: 'images/farm/02-blackdragon.jpeg', desc: '흑룡의환영' },
      { title: '얼음창고', image: 'images/farm/03-icewarehouse.jpeg', desc: '얼음창고' },
      { title: '부유재단', image: 'images/farm/04-floatingaltar.jpeg', desc: '부유재단' },
      { title: '저주받은해적선', image: 'images/farm/05-pirateship.jpeg', desc: '저주받은해적선' },
      { title: '천명부화장', image: 'images/farm/06-destinygrave.jpeg', desc: '천명부화장' },
      { title: '귀면극단', image: 'images/farm/07-masktheater.jpeg', desc: '귀면극단' }
    ];

    function renderFarmingGuide() {
      const currentStep = farmingSteps[selectedFarmIndex] || farmingSteps[0];
      const buttons = farmingSteps.map((step, index) =>
        '<button class="farm-top-btn ' + (index === selectedFarmIndex ? 'active' : '') + '" data-index="' + index + '">' + step.title + '</button>'
      ).join('');

      displayArea.innerHTML =
        '<div class="farm-button-wrap" id="farmButtonWrap">' + buttons + '</div>' +
        '<article class="farm-detail">' +
          '<div class="farm-detail-head">' +
            '<h3>' + currentStep.title + '</h3>' +
            '<span class="farm-badge">' + String(selectedFarmIndex + 1).padStart(2, '0') + ' / ' + String(farmingSteps.length).padStart(2, '0') + '</span>' +
          '</div>' +
          '<p>' + currentStep.desc + '</p>' +
          '<img src="' + currentStep.image + '" alt="' + currentStep.title + '" onerror="this.style.display=\'none\'">' +
        '</article>';

      document.querySelectorAll('#farmButtonWrap .farm-top-btn').forEach(button => {
        button.addEventListener('click', () => {
          selectedFarmIndex = Number(button.dataset.index);
          renderFarmingGuide();
        });
      });
    }

    function switchView(id) {
      const data = config[id];
      navBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.id === id));
      
      document.getElementById('sideLabel').textContent = data.label;
      document.getElementById('sideTitle').innerHTML = data.title;
      document.getElementById('sideDesc').textContent = data.desc;

      displayArea.innerHTML = '';
      if (data.type === 'image') {
        displayArea.innerHTML = `<img src="${data.path}" class="content-img" onerror="this.src='https://via.placeholder.com/800x1000/111/3fff00?text=IMAGE+NOT+FOUND'">`;
      } else if (data.type === 'farm') {
        renderFarmingGuide();
      } else if (data.type === 'drop') {
        renderDropSearch();
      }
    }

    function cellText(value) {
      return value === undefined || value === null ? '' : String(value).trim();
    }

    function sheetToObjects(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (!rows.length) return [];
      const headers = rows[0].map(cellText);
      return rows.slice(1)
        .filter(row => row.some(value => cellText(value) !== ''))
        .map(row => {
          const obj = {};
          headers.forEach((header, index) => {
            if (header) obj[header] = cellText(row[index]);
          });
          return obj;
        });
    }

    function normalizeDropData(sourceDungeonRows, sourceDropRows) {
      const ignoredDungeonIds = new Set(['번골']);

      dungeonMap.clear();
      dungeonRows = (sourceDungeonRows || [])
        .map(row => ({
          '던전ID': cellText(row['던전ID']),
          '던전명': cellText(row['던전명']),
          '설명': cellText(row['설명'])
        }))
        .filter(row => row['던전ID'] && !ignoredDungeonIds.has(row['던전ID']));

      dungeonRows.forEach(row => {
        const id = cellText(row['던전ID']);
        if (id) dungeonMap.set(id.toUpperCase(), cellText(row['던전명']) || id);
      });

      dropRows = (sourceDropRows || [])
        .map(row => {
          const dungeonId = cellText(row['던전ID']);
          const dungeonKey = dungeonId.toUpperCase();
          return {
            dungeonId,
            dungeonKey,
            dungeonName: dungeonMap.get(dungeonKey) || dungeonId,
            grade: normalizeGrade(row['등급']),
            item: cellText(row['아이템'])
          };
        })
        .filter(row => row.dungeonId && row.item && !ignoredDungeonIds.has(row.dungeonId));

      const firstVisible = getVisibleDungeons()[0];
      selectedDungeonId = firstVisible?.id || dropRows[0]?.dungeonKey || null;
    }

    async function loadExcelData() {
      if (excelLoaded || excelLoading) return;
      excelLoading = true;
      try {
        if (typeof XLSX === 'undefined') {
          throw new Error('XLSX 라이브러리를 불러오지 못했습니다. 내장 데이터를 사용합니다.');
        }

        const response = await fetch(`data/info_search_data.xlsx?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`엑셀 파일을 찾을 수 없습니다. 경로: data/info_search_data.xlsx (${response.status})`);
        }

        const buffer = await response.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array', cellDates: false, raw: false });
        const dungeonSheet = workbook.Sheets['던전목록'];
        const dropSheet = workbook.Sheets['드랍목록'];

        if (!dungeonSheet || !dropSheet) {
          throw new Error('필수 시트명(던전목록, 드랍목록)을 찾을 수 없습니다.');
        }

        normalizeDropData(sheetToObjects(dungeonSheet), sheetToObjects(dropSheet));
        excelLoaded = true;
      } catch (error) {
        console.warn('[drop-data] 엑셀 로딩 실패, 내장 데이터로 대체합니다:', error);
        normalizeDropData(fallbackDungeonRows, fallbackDropRows);
        excelLoaded = true;
      } finally {
        excelLoading = false;
      }
    }

    function getVisibleDungeons() {
      const ids = new Set(dropRows.map(row => row.dungeonKey));
      const fromDungeonSheet = dungeonRows
        .map(row => ({ id: cellText(row['던전ID']).toUpperCase(), name: cellText(row['던전명']) }))
        .filter(row => row.id && ids.has(row.id));

      const missing = [...ids]
        .filter(id => !fromDungeonSheet.some(row => row.id === id))
        .map(id => ({ id, name: dungeonMap.get(id) || id }));

      return [...fromDungeonSheet, ...missing];
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[char]));
    }

    const gradeDisplayOrder = ['입문', '일반', '숙련', '리뉴얼', '대정기', '3단', '6단', '9단', '기타'];

    function normalizeGrade(grade) {
      const text = cellText(grade);
      if (!text) return '기타';
      if (text.includes('입문')) return '입문';
      if (text.includes('일반')) return '일반';
      if (text.includes('숙련')) return '숙련';
      if (text.includes('리뉴얼')) return '리뉴얼';
      if (text.includes('대정기')) return '대정기';
      if (/3\s*단/.test(text)) return '3단';
      if (/6\s*단/.test(text)) return '6단';
      if (/9\s*단/.test(text)) return '9단';
      return text;
    }

    function normalizeSearchText(value) {
      return cellText(value).toLowerCase().replace(/\s+/g, '');
    }

    function rowMatchesKeyword(row, keyword) {
      const rawKeyword = cellText(keyword).toLowerCase();
      const compactKeyword = normalizeSearchText(keyword);
      if (!compactKeyword) return true;

      const haystack = `${row.dungeonName} ${row.grade} ${row.item}`;
      const rawHaystack = haystack.toLowerCase();
      const compactHaystack = normalizeSearchText(haystack);

      return rawHaystack.includes(rawKeyword) || compactHaystack.includes(compactKeyword);
    }

    function buildDungeonGradeGroups(rows) {
      const dungeonGroups = new Map();
      rows.forEach(row => {
        const dungeonKey = row.dungeonKey || row.dungeonName;
        if (!dungeonGroups.has(dungeonKey)) {
          dungeonGroups.set(dungeonKey, {
            dungeonKey,
            dungeonName: row.dungeonName,
            grades: {},
            total: 0
          });
        }

        const group = dungeonGroups.get(dungeonKey);
        const grade = normalizeGrade(row.grade);
        if (!group.grades[grade]) group.grades[grade] = [];
        group.grades[grade].push(row.item);
        group.total += 1;
      });

      const dungeonOrder = new Map(getVisibleDungeons().map((dungeon, index) => [dungeon.id, index]));
      return [...dungeonGroups.values()].sort((a, b) => {
        const orderA = dungeonOrder.has(a.dungeonKey) ? dungeonOrder.get(a.dungeonKey) : 999999;
        const orderB = dungeonOrder.has(b.dungeonKey) ? dungeonOrder.get(b.dungeonKey) : 999999;
        if (orderA !== orderB) return orderA - orderB;
        return cellText(a.dungeonName).localeCompare(cellText(b.dungeonName), 'ko');
      });
    }

    function uniqueItems(items) {
      return [...new Set(items.filter(Boolean))];
    }

    function getOrderedGradeTitles(grades) {
      const titles = Object.keys(grades).filter(title => uniqueItems(grades[title]).length > 0);
      const known = gradeDisplayOrder.filter(title => titles.includes(title));
      const unknown = titles
        .filter(title => !gradeDisplayOrder.includes(title))
        .sort((a, b) => a.localeCompare(b, 'ko'));
      return [...known, ...unknown];
    }

    function renderGradeColumn(title, items) {
      const unique = uniqueItems(items);
      return `
        <section class="drop-grade-col">
          <div class="drop-grade-title">${escapeHtml(title)}</div>
          <div class="drop-item-list">
            ${unique.length
              ? unique.map(item => `<div class="drop-item-chip">${escapeHtml(item)}</div>`).join('')
              : '<div class="drop-empty">드랍 정보 없음</div>'
            }
          </div>
        </section>
      `;
    }

    function renderDropTable() {
      const searchInput = document.getElementById('dropSearchInput');
      const keyword = searchInput?.value.trim() || '';
      const isGlobalSearch = keyword.length > 0;

      // Important: global search mode NEVER uses selectedDungeonId.
      // Empty search mode is the only time the selected dungeon tab is applied.
      const rows = isGlobalSearch
        ? dropRows.filter(row => rowMatchesKeyword(row, keyword))
        : dropRows.filter(row => !selectedDungeonId || row.dungeonKey === selectedDungeonId);

      const resultArea = document.getElementById('dropResultArea');
      const counter = document.getElementById('dropCounter');
      const modeText = document.getElementById('dropSearchModeText');
      const tabs = document.getElementById('dungeonTabs');
      if (!resultArea) return;

      document.querySelectorAll('#dungeonTabs .tab-item').forEach(tab => {
        tab.classList.toggle('active', !isGlobalSearch && tab.dataset.id === selectedDungeonId);
      });
      if (tabs) tabs.classList.toggle('search-mode', isGlobalSearch);

      if (modeText) {
        modeText.innerHTML = isGlobalSearch
          ? '<strong>\uc804\uccb4 \ub358\uc804 \uac80\uc0c9 \uc911</strong> - \uac80\uc0c9\uc5b4\uc640 \uc77c\uce58\ud558\ub294 \ubaa8\ub4e0 \ub358\uc804\uc744 \ud45c\uc2dc\ud569\ub2c8\ub2e4. \ub358\uc804 \ud0ed \uc120\ud0dd\uc740 \uac80\uc0c9 \uacb0\uacfc\uc5d0 \uc801\uc6a9\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.'
          : '<strong>\uc120\ud0dd\ud55c \ub358\uc804 \ubcf4\uae30</strong> - \uac80\uc0c9\uc5b4\uac00 \uc5c6\uc744 \ub54c\ub9cc \uc120\ud0dd\ud55c \ub358\uc804\uc758 \ub4dc\ub78d \ubaa9\ub85d\uc744 \ud45c\uc2dc\ud569\ub2c8\ub2e4.';
      }

      const groups = buildDungeonGradeGroups(rows);
      if (counter) {
        counter.textContent = isGlobalSearch
          ? `${groups.length.toLocaleString()}\uac1c \ub358\uc804 / ${rows.length.toLocaleString()}\uac1c \ud56d\ubaa9`
          : `${rows.length.toLocaleString()}\uac1c \ud56d\ubaa9`;
      }

      if (!rows.length) {
        resultArea.innerHTML = '<div style="padding:22px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:#111;color:#888;text-align:center;">\uac80\uc0c9 \uacb0\uacfc\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
        return;
      }

      resultArea.innerHTML = `
        <div class="drop-group-wrap">
          ${groups.map(group => `
            <article class="drop-dungeon-card">
              <div class="drop-dungeon-title">
                <span>${escapeHtml(group.dungeonName)}</span>
                <small>${group.total.toLocaleString()}개 항목</small>
              </div>
              <div class="drop-grade-grid">
                ${getOrderedGradeTitles(group.grades)
                  .map(title => renderGradeColumn(title, group.grades[title] || []))
                  .join('')}
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    async function renderDropSearch() {
      displayArea.innerHTML = `
        <div style="padding:22px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:#111;color:#aaa;">엑셀 데이터를 불러오는 중입니다...</div>
      `;

      await loadExcelData();
      if (!excelLoaded) return;

      const dungeons = getVisibleDungeons();
      if (!selectedDungeonId && dungeons.length) selectedDungeonId = dungeons[0].id;

      displayArea.innerHTML = `
        <input type="text" id="dropSearchInput" class="search-box" placeholder="🔍 재료명 / 아이템명 검색 시 전체 던전에서 검색됩니다...">
        <div id="dropSearchModeText" class="drop-search-status"></div>
        <div class="dungeon-tabs" id="dungeonTabs">
          ${dungeons.map((dungeon, index) => `
            <div class="tab-item ${dungeon.id === selectedDungeonId || (!selectedDungeonId && index === 0) ? 'active' : ''}" data-id="${dungeon.id}">${dungeon.name}</div>
          `).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#aaa;font-size:13px;">
          <span>출처: data/info_search_data.xlsx <small style="color:#777;">(리뉴얼/대정기/3단/6단/9단 포함)</small></span>
          <span id="dropCounter"></span>
        </div>
        <div id="dropResultArea"></div>
      `;

      document.getElementById('dropSearchInput').addEventListener('input', renderDropTable);
      document.querySelectorAll('#dungeonTabs .tab-item').forEach(tab => {
        tab.addEventListener('click', () => {
          selectedDungeonId = tab.dataset.id;
          const searchInput = document.getElementById('dropSearchInput');
          if (searchInput && searchInput.value.trim()) searchInput.value = '';
          renderDropTable();
        });
      });
      renderDropTable();
    }

    navBtns.forEach(btn => btn.onclick = () => switchView(btn.dataset.id));

    // 팁 로테이션
    const tips = ["TIP: 홍보 보상은 매일 자정에 초기화됩니다.", "TIP: 문파에 가입하여 함께 던전을 돌아보아요~"];
    let tIdx = 0;
    setInterval(() => {
      tIdx = (tIdx + 1) % tips.length;
      document.getElementById('rotatingTip').textContent = tips[tIdx];
    }, 5000);
  </script>
</body>
